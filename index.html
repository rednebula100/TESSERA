<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>TESSERA · 테세라 — 작은 건축가들</title>
  <meta name="description" content="네모난 세계, 작은 건축가들이 쌓아 올리는 기하학의 성소. 브라우저에서 바로 즐기는 미니멀 픽셀 인크리멘탈 게임.">
  <meta name="theme-color" content="#f6f6f4">
  <link rel="icon" type="image/png" href="docs/favicon.png">
  <link rel="apple-touch-icon" href="docs/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TESSERA · 테세라 — 작은 건축가들">
  <meta property="og:description" content="작은 네모 건축가들이 블럭을 하나씩 던져 올려, 수십만 개가 쌓이면 거대한 장미창이 떠오르는 미니멀 픽셀 인크리멘탈 게임.">
  <meta property="og:image" content="https://rednebula100.github.io/TESSERA/docs/og.png">
  <meta property="og:url" content="https://rednebula100.github.io/TESSERA/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <header id="hud">
    <div class="brand">TESSERA<small>테세라</small></div>
    <div id="cur" class="box"></div>
  </header>

  <div id="seals"></div>
  <div id="toasts"></div>

  <aside id="panel" class="box">
    <nav id="tabs"></nav>
    <div id="tabbody"></div>
  </aside>

  <div id="dock">
    <button class="dk" id="btn-zin" title="확대 (+)">＋</button>
    <button class="dk" id="btn-zout" title="축소 (−)">−</button>
    <button class="dk" id="btn-home" title="구조물 전체 보기">⌂</button>
    <button class="dk" id="btn-obs" title="관측 모드 (H)">◉</button>
    <button class="dk" id="btn-snd" title="소리">♪</button>
    <button class="dk" id="btn-set" title="설정">⚙</button>
    <button class="dk" id="btn-panel" title="패널 접기">▤</button>
  </div>

  <div id="tip"></div>
  <div id="hint"></div>
  <div id="card" class="box"></div>
  <div id="modal"></div>
  <div id="obs-hint">관측 중 — 아무 곳이나 클릭하면 돌아갑니다</div>

  <div id="titlecard">
    <div class="tc-logo">TESSERA</div>
    <div class="tc-sub">테세라 · 작은 건축가들</div>
  </div>

  <div id="seq" class="seq"></div>
  <div id="veil" class="gone"></div>

  <script src="vendor/rough.js"></script>
  <script src="vendor/zzfx.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/blueprints.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
