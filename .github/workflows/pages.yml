name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check game scripts
        run: for f in js/*.js; do node --check "$f" || exit 1; done
      - name: Content check (tiers match sizes, milestone rewards, banned words)
        run: node tools/check.js
      - name: Balance check (upper-bound model on the real formulas)
        run: node tools/balance.js --check --quiet
      - name: Verify referenced files exist
        run: |
          grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/.*="([^"]+)"/\1/' | while read -r f; do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js vendor docs audio .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
